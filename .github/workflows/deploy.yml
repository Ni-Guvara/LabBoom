name: Deploy to GitHub Pages

# 纯静态站点：main 每次推送自动构建并发布到
# https://ni-guvara.github.io/LabBoom/
# 路由用 hash（#/lab/L5）、base 是 './'，所以部署在子路径下不需要 404 回退。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；新推送打断排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # build = tsc -b && vite build，类型错误会在这里挡住发布
      # VITE_PAY_BASE 从仓库变量读取；未设置时为空 = 不启用付费守卫（不会误锁死）
      - run: npm run build
        env:
          VITE_PAY_BASE: ${{ vars.PAY_BASE }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
